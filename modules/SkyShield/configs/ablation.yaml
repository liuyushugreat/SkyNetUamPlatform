# Ablation matrix for SkyShield (E5).
#
# Each variant turns off exactly one capability; "full" is the
# complete SkyShield system reported in the headline numbers.

seed: 20260418
scenario:
  name: urban_300km2
  area_km2: 300.0
  duration_s: 240.0
  num_sorties: 30

variants:
  - {name: full,                     fusion: true,  scheduler: true, safety: true, abort: true, degraded: true, gating: true, prio: true}
  - {name: no_multi_radar_fusion,    fusion: false, scheduler: true, safety: true, abort: true, degraded: true, gating: true, prio: true}
  - {name: no_deadline_scheduler,    fusion: true,  scheduler: false,safety: true, abort: true, degraded: true, gating: true, prio: true}
  - {name: no_runtime_safety_guard,  fusion: true,  scheduler: true, safety: false,abort: true, degraded: true, gating: true, prio: true}
  - {name: no_abort_controller,      fusion: true,  scheduler: true, safety: true, abort: false,degraded: true, gating: true, prio: true}
  - {name: no_degraded_tracking,     fusion: true,  scheduler: true, safety: true, abort: true, degraded: false,gating: true, prio: true}
  - {name: no_launch_gating,         fusion: true,  scheduler: true, safety: true, abort: true, degraded: true, gating: false,prio: true}
  - {name: no_prioritization,        fusion: true,  scheduler: true, safety: true, abort: true, degraded: true, gating: true, prio: false}

output_dir: outputs
