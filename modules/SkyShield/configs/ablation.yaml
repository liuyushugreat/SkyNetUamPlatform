# E5: Ablation study — each variant disables exactly one component.
base: default.yaml
variants:
  - name: "full"
    description: "Full SkyShield with all guardrails enabled."
  - name: "no_fusion"
    description: "Disable multi-radar track-level fusion (single-best node)."
    override:
      radars.fusion_enabled: false
  - name: "no_deadline_aware"
    description: "FIFO scheduling instead of EDF + slack stealing."
    override:
      decision.scheduler: "fifo"
  - name: "no_safety_guard"
    description: "Disable runtime safety guard (authorize all confirmed tracks)."
    override:
      safety.guard_enabled: false
  - name: "no_abort"
    description: "Remove abort controller (no recall / return-safe)."
    override:
      safety.return_safe_enabled: false
  - name: "no_degraded_mode"
    description: "Disable degraded-tracking mode under packet dropout."
    override:
      tracker.degraded_mode: false
  - name: "no_launch_gating"
    description: "Disable false-launch suppression before launch ack."
    override:
      decision.false_launch_block: false
  - name: "no_prioritization"
    description: "Treat all threats with equal priority (no slack stealing)."
    override:
      decision.prioritizer: "round_robin"
