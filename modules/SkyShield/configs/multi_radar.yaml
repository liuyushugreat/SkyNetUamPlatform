# E4: Multi-radar urban deployment sweep.
# The scheduler, tracker and interceptor settings are inherited
# from default.yaml; only the radar fabric and target load change.

base: default.yaml
sweep:
  radar_counts: [1, 2, 4, 6, 8, 12]
  # Target concurrency stresses the decision plane.
  target_concurrency: [1, 2, 4, 8]
  seed_offsets: [0, 1, 2]            # 3 seeds per cell for error bars
