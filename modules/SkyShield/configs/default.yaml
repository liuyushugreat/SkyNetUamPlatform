# SkyShield default configuration for RTSS 2026 reviewers.
# Everything here is plain data; all runtime knobs are reproducible
# from this single file.

seed: 20260418

# --- Protected urban region ----------------------------------------------
city:
  name: "Urban District U-300"
  area_km2: 300.0
  # Rectangular bounding box (x_km, y_km) for simulation convenience.
  bbox_km: [0.0, 0.0, 20.0, 15.0]
  # A handful of no-fly and high-value zones inside the box.
  no_fly_zones:
    - name: "Transit Hub"
      center_km: [4.5, 7.2]
      radius_km: 0.8
    - name: "Medical Campus"
      center_km: [12.0, 4.0]
      radius_km: 0.6
    - name: "Power Substation"
      center_km: [16.5, 10.5]
      radius_km: 0.4

# --- Multi-radar fabric (PLFM-style nodes) --------------------------------
radars:
  count: 4
  coverage_km: 6.5                # 95% detection range per node
  range_km_max: 9.0               # geometric max at SNR floor
  dwell_ms: 18.0                  # dwell per beam
  revisit_ms: 35.0                # nominal track revisit
  packet_mean_ms: 5.0             # radar -> edge packetization + transport
  packet_jitter_ms: 2.0
  dropout_rate: 0.015
  placement:                      # anchored nodes inside the 300 km^2 box
    - [3.0, 3.5]
    - [16.0, 4.0]
    - [4.0, 12.5]
    - [17.0, 11.0]

# --- Tracker (CV Kalman + M-of-N confirmation) ---------------------------
tracker:
  process_noise: 0.8              # m/s^2, 1-sigma
  meas_noise_m: 12.0              # radar range-Doppler cross-sigma
  confirm_m_of_n: [3, 5]          # three detections within last five dwells
  gate_sigma: 3.0

# --- Decision plane -------------------------------------------------------
decision:
  deadline_ms:                    # per-stage *budgets*; closed loop sums to 1500 ms
    detection: 60.0
    track_confirm: 80.0
    fusion: 25.0
    decision: 30.0
    launch_actuation: 120.0
    interceptor_reaction: 250.0
    end_to_end: 1500.0
  scheduler: "edf_slack"          # {edf, rm, edf_slack}
  threat_threshold: 0.55          # fused-track threat score to authorize
  authorization_ms_mean: 45.0     # human-in-the-loop authorization latency
  authorization_ms_std: 12.0
  false_launch_block: true
  prioritizer: "priority_queue"

# --- Runtime safety guard / abort controller ------------------------------
safety:
  guard_enabled: true
  abort_deadline_ms: 200.0        # R3 budget
  return_safe_enabled: true
  geofence_margin_m: 100.0
  friendly_airspace_check: true
  target_class_conf_min: 0.7

# --- Interceptor kinematics (from the Counter-UAV spec sheet) ------------
interceptor:
  mass_kg: 1.8
  max_speed_mps: 97.2             # 350 km/h
  cruise_speed_mps: 55.6          # 200 km/h
  endurance_s: 210.0              # 3.5 min full payload
  acc_mps2: 22.0
  hit_prob_nominal: 0.80
  hit_prob_under_maneuver: 0.52
  base_km: [10.0, 7.5]            # central launch cradle

# --- Workload (replay + synthetic intruders) ------------------------------
workload:
  duration_s: 300.0               # 5 virtual minutes per run
  threat_arrival_rate_hz: 0.12    # per second, over whole box
  target_speed_mps:
    mean: 32.0
    std: 6.0
  target_altitude_m:
    mean: 120.0
    std: 18.0
  maneuver_prob: 0.10
  authorized_loss_budget: 0.005   # 0.5% deadline-miss target
